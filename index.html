<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giải mã Ô Chữ</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1>Giải mã Ô Chữ</h1>

  <div class="controls">
    <label for="questionCount">Chọn số câu hỏi:</label>
    <select id="questionCount">
      <option value="5">5 câu</option>
      <option value="7">7 câu</option>
      <option value="10">10 câu</option>
    </select>
    <button id="generateButton">Tạo Bảng</button>
  </div>

  <div id="crossword-container"></div>
  <button id="checkButton">Kiểm tra Đáp Án</button>
  <div id="result"></div>

  <script src="js/script.js" defer></script>
</body>
</html>
